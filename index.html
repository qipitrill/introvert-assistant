<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки ИИ-Адвоката</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Стили для заблокированной кнопки */
        button:disabled {
            background-color: #aaaaaa;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body>

 <h2>🛡️ Параметры ИИ-Адвоката</h2>

    <div class="form-group">
        <label for="rawText">Что случилось? (Сырой текст):</label>
        <textarea id="rawText" rows="4" placeholder="Например: скажи соседям чтобы убрали свой хлам..."></textarea>
    </div>
    <div class="form-group">
    <label for="targetInput">Кому отправить (@username или номер):</label>
    <input type="text" id="targetInput" placeholder="@username или +34..." 
           style="width:100%; padding:10px; border:1px solid var(--tg-theme-hint-color,#ccc); 
                  border-radius:8px; background:var(--tg-theme-secondary-bg-color,#f5f5f5); 
                  color:var(--tg-theme-text-color,#000); box-sizing:border-box; font-size:16px;">
</div>

    <div class="form-group">
        <label for="styleSelect">Выберите стиль ответа:</label>
        <select id="styleSelect">
            <optgroup label="👔 Официальный тон (Обращение на «Вы»)">
                <option value="style_business" title="Для работы">💼 Деловая этика — Рабочий конструктив (коллеги, клиенты)</option>
                <option value="style_diplomat" title="Сглаживание углов">🕊️ Дипломат — Мягкий тон (деликатные просьбы, вежливые отказы)</option>
                <option value="style_boundaries" title="Претензии и разборки">⚖️ Твердые границы — Строгий, холодный тон (претензии, долги)</option>
            </optgroup>
            
            <optgroup label="🤝 Неформальный тон (Обращение на «Ты»)">
                <option value="style_friendly" title="Для близких">❤️ По-дружески — Теплый, живой тон без канцеляризма (друзья, семья)</option>
                <option value="style_direct" title="Без лишних слов">⚡ Прямо и четко — Суть дела без preлюдий (когда друг тупит)</option>
            </optgroup>
        </select>
    </div>

    <button id="sendDataBtn">Сформулировать ответ</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем окно на весь экран

        // Подставляем сохранённого адресата если есть
        const urlParams = new URLSearchParams(window.location.search);
        const savedTarget = urlParams.get('target');
        if (savedTarget) {
            document.getElementById('targetInput').value = savedTarget;
        }

        // Находим кнопку один раз
        const sendBtn = document.getElementById('sendDataBtn');

        // Используем жесткий .onclick вместо addEventListener
        sendBtn.onclick = () => {
            // Если кнопка уже отключена, выходим, чтобы не слать дубли
            if (sendBtn.disabled) return;

            const text = document.getElementById('rawText').value.trim();
            const target = document.getElementById('targetInput').value.trim();
            const style = document.getElementById('styleSelect').value;

            if (!text) {
                alert('Пожалуйста, введите текст сообщения!');
                return;
            }
            if (!target) {
    alert('Пожалуйста, укажите адресата!');
    return;
}
if (!target.startsWith('@') && !target.startsWith('+')) {
    alert('Адресат должен начинаться с @ или +');
    return;
}

            // ВКЛЮЧАЕМ ЗАЩИТУ: Моментально гасим кнопку
            sendBtn.disabled = true;
            sendBtn.innerText = "Формулирую...";

            // Упаковываем данные в JSON-строку
           const dataToSend = { text: text, style: style, target: target };

            // Отправляем данные обратно боту и закрываем окно
            tg.sendData(JSON.stringify(dataToSend));
        };
    </script>
</body>
</html>
