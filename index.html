<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки ИИ-Адвоката</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🛡️ Параметры ИИ-Адвоката</h2>

    <div class="form-group">
        <label for="rawText">Что случилось? (Сырой текст):</label>
        <textarea id="rawText" rows="4" placeholder="Например: скажи шефу что я заболел, но вежливо..."></textarea>
    </div>

    <div class="form-group">
        <label for="styleSelect">Выберите стиль ответа:</label>
        <select id="styleSelect">
            <option value="style_diplomat">💼 Дипломатичный компромисс</option>
            <option value="style_cold">❄️ Хладнокровный юридический отказ</option>
            <option value="style_fact">⚡ Короткий жесткий факт</option>
        </select>
    </div>

    <button id="sendDataBtn">Сформулировать ответ</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем окно на весь экран

        document.getElementById('sendDataBtn').addEventListener('click', () => {
            const text = document.getElementById('rawText').value.trim();
            const style = document.getElementById('styleSelect').value;

            if (!text) {
                alert('Пожалуйста, введите текст сообщения!');
                return;
            }

            // Упаковываем данные в JSON-строку
            const dataToSend = {
                text: text,
                style: style
            };

            // Отправляем данные обратно боту и закрываем окно
            tg.sendData(JSON.stringify(dataToSend));
        });
    </script>
</body>
</html>
